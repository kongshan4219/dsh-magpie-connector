name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under (default: latest)'
        required: false
        default: latest

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'kongshan4219/dsh-magpie-connector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.15.0
      - name: Check tag and package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF" = "refs/tags/v$version" || { echo "Run this workflow on tag v$version."; exit 1; }
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: npm run typecheck && npm test
      - name: Publish
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(mktemp)"
          # A manually bootstrapped version can already exist on the registry.
          if npm view "$name@$version" version --json > "$published" &&
              node -e 'if (JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")) !== process.argv[2]) process.exit(1)' "$published" "$version"; then
            echo "$name@$version is already on npm."
            exit 0
          fi
          # Only a missing package or version should lead to a publish attempt.
          node -e 'if (JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).error?.code !== "E404") process.exit(1)' "$published"
          npm publish --access public --tag "$NPM_DIST_TAG"
      - name: Create GitHub Release with the published npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Download the registry artifact so GitHub and npm distribute identical bytes.
          assets="$(mktemp -d)"
          # A fresh publish can take minutes to become downloadable; retry before failing.
          for attempt in $(seq 1 20); do
            if npm pack "$name@$version" --ignore-scripts --pack-destination "$assets" --json > "$assets/pack.json"; then break; fi
            if [ "$attempt" = 20 ]; then echo "npm tarball for $name@$version still unavailable" >&2; exit 1; fi
            sleep 30
          done
          filename="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$assets/pack.json")"
          node --input-type=module - "$version" "$assets/notes.md" <<'NODE'
          import fs from 'node:fs'
          const [version, output] = process.argv.slice(2)
          // Headings may carry a date suffix ("## 1.2.3 — 2026-01-01"); the section ends at the next "## ".
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n')
          const start = lines.findIndex(l => l === `## ${version}` || l.startsWith(`## ${version} `))
          if (start < 0) throw new Error(`No changelog entry for ${version}`)
          const end = lines.findIndex((l, i) => i > start && l.startsWith('## '))
          const section = lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim()
          if (!section) throw new Error(`Empty changelog entry for ${version}`)
          fs.writeFileSync(output, section + '\n')
          NODE
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$assets/$filename" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$assets/$filename" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$version" --notes-file "$assets/notes.md"
          fi
